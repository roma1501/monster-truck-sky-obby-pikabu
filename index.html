    <link rel="icon" type="image/png" href="assets/ui/favicon.png">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #14161a;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
        /* ПК с ультрашироким окном: поле игры не шире 2:1, по бокам — поля (класс ставит Game.js на Playgama) */
        @media (min-aspect-ratio: 2/1) and (hover: hover) and (pointer: fine) {
            html.aspect-2x1 body { width: 200vh; margin: 0 auto; position: relative; transform: translateZ(0); }
        }
        img { -webkit-user-drag: none; }
        #world3d {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            touch-action: none;
        }
        /* Шрифты (SIL OFL, Asset Library Lory Engine): Bungee — заголовки, кнопки, цифры (латиница); Rubik — кириллица и мелкий текст */
        @font-face { font-family: 'Bungee'; src: url('assets/fonts/bungee.ttf?v=1.0.1-be8152f3') format('truetype'); font-weight: 400; font-style: normal; font-display: swap; }
        @font-face { font-family: 'Rubik'; src: url('assets/fonts/rubik.ttf?v=1.0.1-be8152f3') format('truetype'); font-weight: 300 900; font-style: normal; font-display: swap; }
        :root {
            /* «Шоу монстр-траков»: сталь, ржавый оранжевый, сигнальный жёлтый, грязь. Имена переменных прежние — меняются значения. */
            --bo-dark: #14161a; --bo-asphalt: #23272e; --bo-ink: #07080a; --bo-edge: rgba(255,255,255,.3);
            --bo-steel: #3a414c; --bo-steel-hi: #6b7482; --bo-mud: #4b3320;
            --bo-purple: #59626f; --bo-orange: #ff7a1a; --bo-green: #8fd634;
            --bo-yellow: #ffc400; --bo-red: #e8321e; --bo-sky: #3fc7ff; --bo-pink: #ff5a7a; --bo-white: #ffffff;
            --bo-font: 'Bungee', 'Rubik', 'Arial Black', system-ui, sans-serif;
            --bo-text: 'Rubik', system-ui, sans-serif;
            /* рифлёная сталь, жёлто-чёрная предупреждающая полоса, грязь, клёпки — только CSS, без картинок */
            --bo-carbon: repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px), repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 1px, transparent 1px 5px), linear-gradient(180deg, #353b45 0%, #1e2229 100%);
            --bo-hazard: repeating-linear-gradient(-45deg, #ffc400 0 10px, #14161a 10px 20px);
            --bo-rivet: radial-gradient(circle, #f1f4f8 0 1.4px, #8b94a1 2px 3.4px, rgba(0,0,0,.55) 3.8px 4.6px, transparent 5px);
            --bo-rivets: var(--bo-rivet) left 6px top 6px / 12px 12px no-repeat, var(--bo-rivet) right 6px top 6px / 12px 12px no-repeat, var(--bo-rivet) left 6px bottom 6px / 12px 12px no-repeat, var(--bo-rivet) right 6px bottom 6px / 12px 12px no-repeat;
            --bo-splat: radial-gradient(ellipse 26% 14% at 12% 100%, rgba(75,51,32,.9) 0 60%, transparent 62%), radial-gradient(ellipse 18% 11% at 38% 100%, rgba(75,51,32,.8) 0 60%, transparent 62%), radial-gradient(ellipse 30% 12% at 84% 100%, rgba(75,51,32,.88) 0 60%, transparent 62%);
            --bo-outline: -1px 0 0 var(--bo-ink), 1px 0 0 var(--bo-ink), 0 -1px 0 var(--bo-ink), 0 1px 0 var(--bo-ink), 1px 2px 0 var(--bo-ink), 2px 3px 0 var(--bo-ink), 3px 4px 0 var(--bo-ink), 0 7px 12px rgba(0,0,0,.5);
            --bo-outline-thin: -1px 0 0 var(--bo-ink), 1px 0 0 var(--bo-ink), 0 -1px 0 var(--bo-ink), 0 1px 0 var(--bo-ink), 1px 2px 0 var(--bo-ink), 0 3px 5px rgba(0,0,0,.45);
            --tut-font: var(--bo-text); --tut-bg: rgba(24,27,32,.95); --tut-fg: #ffffff; --tut-accent: #ffc400; --tut-border: #ff7a1a; --tut-radius: 4px;
        }
        * { -webkit-tap-highlight-color: transparent; }
        /* Шрифт игры — Bungee (+ Rubik для кириллицы): окна, всплывающие надписи, обучение, кнопки ввода */
        body, button, input, select { font-family: var(--bo-font); }
        body { font-weight: 400; }
        body * { font-synthesis: none; -webkit-font-smoothing: antialiased; }
        /* Общие классы интерфейса игры: кнопка — стальная плита с клёпками и предупреждающей полосой снизу, панель — стальной щит
           с клёпками и брызгами грязи, hazard-лента, шахматка (только финиш), шильдик-номер. Текст остаётся прямым. */
        .bo-btn { --c: var(--bo-green); position: relative; isolation: isolate; display: inline-flex; align-items: center; justify-content: center; gap: .4em;
            min-height: 44px; padding: .55em 1.5em .7em; border: 0; border-radius: 0; background: none; color: #fff; font: 400 17px/1.1 var(--bo-font);
            text-shadow: var(--bo-outline-thin); letter-spacing: .04em; text-transform: uppercase; cursor: pointer; user-select: none;
            transform: translateY(0); transition: transform .08s, filter .15s; touch-action: manipulation; }
        .bo-btn::before { content: ''; position: absolute; inset: 0; z-index: -1; border-radius: 5px; border: 3px solid var(--bo-ink);
            background: var(--bo-rivet) left 5px top 5px / 11px 11px no-repeat, var(--bo-rivet) right 5px top 5px / 11px 11px no-repeat, var(--bo-rivet) left 5px bottom 9px / 11px 11px no-repeat, var(--bo-rivet) right 5px bottom 9px / 11px 11px no-repeat,
                linear-gradient(180deg, rgba(255,255,255,.4) 0%, rgba(255,255,255,.07) 46%, rgba(0,0,0,.3) 100%),
                repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 3px), var(--c);
            box-shadow: inset 0 0 0 2px rgba(255,255,255,.34), inset 0 -4px 0 rgba(0,0,0,.28), 0 5px 0 var(--bo-ink), 0 6px 8px rgba(0,0,0,.4);
            transition: box-shadow .08s, filter .15s; }
        /* предупреждающая полоса по нижней кромке плиты */
        .bo-btn::after { content: ''; position: absolute; z-index: -1; left: 14px; right: 14px; bottom: 5px; height: 5px; border-radius: 1px; pointer-events: none;
            background: var(--bo-hazard); opacity: .85; box-shadow: 0 0 0 1px var(--bo-ink); }
        .bo-btn:hover::before { filter: brightness(1.12); }
        .bo-btn:active { transform: translateY(4px); }
        .bo-btn:active::before { box-shadow: inset 0 0 0 2px rgba(255,255,255,.34), inset 0 -3px 0 rgba(0,0,0,.28), 0 1px 0 var(--bo-ink); }
        .bo-btn[disabled], .bo-btn.is-off { cursor: default; }
        .bo-btn[disabled]::before, .bo-btn.is-off::before { filter: grayscale(.85) brightness(.7); }
        .bo-btn.is-off:active, .bo-btn[disabled]:active { transform: none; }
        .bo-btn.is-off:active::before, .bo-btn[disabled]:active::before { box-shadow: inset 0 0 0 2px rgba(255,255,255,.34), inset 0 -4px 0 rgba(0,0,0,.28), 0 5px 0 var(--bo-ink); }
        .bo-btn.round { width: 50px; height: 50px; min-height: 0; padding: 0; border-radius: 0; font-size: 22px; }
        .bo-btn.round::before { border-radius: 8px; background: var(--bo-rivet) left 4px top 4px / 9px 9px no-repeat, var(--bo-rivet) right 4px bottom 4px / 9px 9px no-repeat, linear-gradient(180deg, rgba(255,255,255,.4), rgba(0,0,0,.3)), var(--c); }
        .bo-btn.round::after { display: none; }
        .bo-btn .bo-ico { width: 1.2em; height: 1.2em; display: inline-block; flex: none; }
        /* на светлых акцентах (жёлтый, лайм, голубой, оранжевый) буквы тёмные, на тёмных — светлые: цвет считается от --c */
        @supports (color: oklch(from red l c h)) {
            .bo-btn { color: oklch(from var(--c) clamp(.1, (.66 - l) * 99, .98) 0 0); text-shadow: 0 1px 0 oklch(from var(--c) clamp(0, (l - .6) * 99, 1) 0 0 / .5); }
        }
        /* панель: стальной щит с клёпками по углам, жёлтая кромка (--hc), брызги грязи внизу */
        .bo-panel { --hc: #ffc400; position: relative; isolation: isolate; padding: 4px; color: #e9edf3; font: 600 16px var(--bo-text); border-radius: 8px;
            background: linear-gradient(135deg, var(--hc) 0%, #6a717c 40%, var(--hc) 100%); box-shadow: 0 0 0 3px var(--bo-ink), 0 10px 22px rgba(0,0,0,.55); }
        .bo-panel::before { content: ''; position: absolute; inset: 4px; z-index: -1; border-radius: 5px; background: var(--bo-rivets), var(--bo-splat), var(--bo-carbon); background-color: #23272e;
            box-shadow: inset 0 0 0 2px rgba(0,0,0,.55), inset 0 0 22px rgba(0,0,0,.45); }
        .bo-checker { background-color: #fff; background-image: linear-gradient(45deg, var(--bo-ink) 25%, transparent 25%, transparent 75%, var(--bo-ink) 75%),
            linear-gradient(45deg, var(--bo-ink) 25%, transparent 25%, transparent 75%, var(--bo-ink) 75%);
            background-size: 16px 16px; background-position: 0 0, 8px 8px; }
        .bo-hazard { background: var(--bo-hazard); }
        .bo-title { font: 400 clamp(24px, 4.6vw, 38px)/1.08 var(--bo-font); color: #fff; text-transform: uppercase; text-shadow: var(--bo-outline), 3px 4px 0 var(--bo-orange); letter-spacing: .02em; }
        /* шильдик-номер: стальная пластина с жёлтой полосой слева */
        .bo-bib { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px 3px 18px; background: linear-gradient(180deg, #d6dbe2, #9aa2ad); color: var(--bo-dark); border: 3px solid var(--bo-ink);
            border-left: 10px solid #ffc400; border-radius: 4px; font: 400 15px var(--bo-font); letter-spacing: .05em; box-shadow: inset 0 0 0 2px rgba(255,255,255,.5), 0 3px 0 var(--bo-ink); }
        .bo-outline { text-shadow: var(--bo-outline); color: #fff; }
        #loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 14px;
            overflow: hidden;
            background: radial-gradient(120% 90% at 50% 0%, #3b4452 0%, #1d2128 52%, #0a0b0e 100%);
            z-index: 1000;
        }
        #loading-screen::before { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .5;
            background: repeating-linear-gradient(45deg, rgba(255,255,255,.035) 0 3px, transparent 3px 9px), linear-gradient(180deg, transparent 55%, rgba(255,122,26,.22) 100%); }
        #loading-screen::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 26px; pointer-events: none; background: var(--bo-hazard); border-top: 4px solid var(--bo-ink); opacity: .9; }
        .loading-text { font: 700 14px var(--bo-text); color: #b9c2d0; text-align: center; min-height: 1em; letter-spacing: .1em; text-transform: uppercase; }
        .loading-bar { position: relative; width: min(340px, 74vw); height: 22px; background: #0b0c0f; border: 3px solid #8b94a1; border-radius: 4px; overflow: hidden;
            box-shadow: 0 0 0 3px var(--bo-ink), 0 6px 0 3px var(--bo-ink); }
        .loading-progress { height: 100%; width: 0%; background: repeating-linear-gradient(-45deg, #ff7a1a 0 11px, #ffc400 11px 22px); background-size: 31px 100%; transition: width 0.3s ease; animation: bo-stripes .7s linear infinite; }
        @keyframes bo-stripes { to { background-position: 31px 0; } }
        #loading-title { margin: 0; font: 400 clamp(28px, 6.4vw, 58px)/1.05 var(--bo-font); color: #fff; text-align: center; max-width: 92vw; text-transform: uppercase;
            text-shadow: -2px -2px 0 var(--bo-ink), 2px -2px 0 var(--bo-ink), -2px 2px 0 var(--bo-ink), 3px 3px 0 var(--bo-ink), 5px 5px 0 var(--bo-orange), 6px 6px 0 var(--bo-ink), 0 10px 16px rgba(0,0,0,.6); letter-spacing: .01em; }
        /* дорожка с траком: разметка бежит под колёсами, пыль сзади */
        .loading-lane { position: relative; width: min(480px, 90vw); display: flex; justify-content: center; padding-bottom: 14px; }
        .loading-lane::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 12px; border-block: 3px solid rgba(255,255,255,.5); background: #0b0c0f; }
        .loading-lane::after { content: ''; position: absolute; left: 0; right: 0; bottom: 4px; height: 4px; opacity: .9;
            background: repeating-linear-gradient(90deg, #ffc400 0 34px, transparent 34px 68px); animation: bo-road .55s linear infinite; }
        @keyframes bo-road { to { background-position: -68px 0; } }
        .loading-car { position: relative; width: clamp(150px, 30vh, 260px); height: auto; margin-bottom: 6px; animation: bo-roll 1.1s ease-in-out infinite alternate; filter: drop-shadow(0 6px 0 rgba(0,0,0,.45)); }
        .loading-streaks { position: absolute; left: 0; width: 34%; top: 40%; height: 40%; pointer-events: none; opacity: .8;
            background: radial-gradient(circle at 70% 60%, rgba(150,120,80,.8) 0 8px, transparent 9px), radial-gradient(circle at 45% 40%, rgba(150,120,80,.55) 0 12px, transparent 13px), radial-gradient(circle at 20% 70%, rgba(150,120,80,.4) 0 16px, transparent 17px);
            animation: bo-streak .6s linear infinite alternate; }
        @keyframes bo-streak { from { transform: translateX(-16px); opacity: .4; } to { transform: translateX(6px); opacity: .85; } }
        @keyframes bo-roll { 0% { transform: translateX(-6px) rotate(-1.8deg) translateY(2px); } 100% { transform: translateX(6px) rotate(1.8deg) translateY(-5px); } }
        .loading-car .w { transform-box: fill-box; transform-origin: center; animation: bo-spin .8s linear infinite; }
        @keyframes bo-spin { to { transform: rotate(360deg); } }
        #loading-percent { font: 400 22px var(--bo-font); color: var(--bo-yellow); text-shadow: 0 2px 0 var(--bo-ink), 0 0 .6em rgba(255,196,0,.45); letter-spacing: .06em; font-variant-numeric: tabular-nums; }
        #loading-retry { position: relative; isolation: isolate; padding: 12px 28px; border: 0; background: none; color: var(--bo-dark); font: 400 18px var(--bo-font); cursor: pointer; letter-spacing: .03em; text-transform: uppercase; }
        #loading-retry::before { content: ''; position: absolute; inset: 0; z-index: -1; border-radius: 5px; border: 3px solid var(--bo-ink); background: linear-gradient(180deg, rgba(255,255,255,.45), rgba(0,0,0,.2)), var(--bo-green);
            box-shadow: 0 5px 0 var(--bo-ink); }
    </style>
</head>

    <script>
        // Игровая область: долгий тап и ПКМ не открывают меню браузера, картинки не
        // тянутся, текст не выделяется — кроме настоящих полей ввода.
        (() => {
            const isField = t => t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
            for (const type of ['contextmenu', 'dragstart', 'selectstart']) {
                document.addEventListener(type, e => { if (!isField(e.target)) e.preventDefault(); });
            }
        })();
    </script>
